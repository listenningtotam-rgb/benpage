      <p id="hint">Press <kbd>Space</kbd> or Tap to Play</p>
      <div class="scroll-indicator">↓ Scroll to explore</div>
    </section>

    <!-- Music Section -->
    <section id="music" class="section">
      <h2 class="section-title">Music</h2>
      <div class="track-list">
        <div class="track-card">
          <div class="track-info">
            <span class="track-number">01</span>
            <div class="track-meta">
              <h3 class="track-title">Midnight Dreams</h3>
              <span class="track-duration">3:42</span>
            </div>
          </div>
          <audio class="track-audio" controls preload="none">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg" />
          </audio>
        </div>

        <div class="track-card">
          <div class="track-info">
            <span class="track-number">02</span>
            <div class="track-meta">
              <h3 class="track-title">Ocean Waves</h3>
              <span class="track-duration">4:15</span>
            </div>
          </div>
          <audio class="track-audio" controls preload="none">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" type="audio/mpeg" />
          </audio>
        </div>

        <div class="track-card">
          <div class="track-info">
            <span class="track-number">03</span>
            <div class="track-meta">
              <h3 class="track-title">Neon Lights</h3>
              <span class="track-duration">5:08</span>
            </div>
          </div>
          <audio class="track-audio" controls preload="none">
            <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3" type="audio/mpeg" />
          </audio>
        </div>
      </div>
    </section>

    <!-- Vinyl Section (record wall) -->
    <section id="vinyl" class="section">
      <h2 class="section-title">Vinyl</h2>
      <div class="vinyl-wall" id="vinylWall">
        <!-- 16 vinyl records dynamically rendered -->
      </div>
    </section>

    <!-- Video Section -->
    <section id="video" class="section">
      <h2 class="section-title">Video</h2>
      <div class="video-container">
        <video class="video-player" controls preload="metadata" poster="https://picsum.photos/seed/videoposter/800/450">
          <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4" />
          Your browser does not support video playback.
        </video>
        <p class="video-caption">Latest Release — Coming Soon</p>
      </div>
    </section>

    <!-- Contact Section (placeholder) -->
    <section id="contact" class="section">
      <h2 class="section-title">Contact</h2>
      <p class="section-placeholder">Coming soon...</p>
    </section>
  </div>

  <!-- Vinyl Detail Popup -->
  <div id="vinylPopup" class="popup-overlay hidden">
    <div class="popup-card">
      <button class="popup-close" id="popupClose">&times;</button>
      <img id="popupImage" src="" alt="" class="popup-image" />
      <div class="popup-info">
        <h3 id="popupTitle"></h3>
        <p id="popupArtist"></p>
        <p id="popupYear"></p>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script>
    // ─── Vinyl Records Data ───────────────────────────────
    const vinylRecords = [
      { id: 1,  title: "Abbey Road",        artist: "The Beatles",        year: 1969, img: "https://picsum.photos/seed/vinyl1/400/400" },
      { id: 2,  title: "Thriller",           artist: "Michael Jackson",    year: 1982, img: "https://picsum.photos/seed/vinyl2/400/400" },
      { id: 3,  title: "The Dark Side of the Moon", artist: "Pink Floyd", year: 1973, img: "https://picsum.photos/seed/vinyl3/400/400" },
      { id: 4,  title: "Rumours",            artist: "Fleetwood Mac",      year: 1977, img: "https://picsum.photos/seed/vinyl4/400/400" },
      { id: 5,  title: "Back to Black",      artist: "Amy Winehouse",      year: 2006, img: "https://picsum.photos/seed/vinyl5/400/400" },
      { id: 6,  title: "Random Access Memories", artist: "Daft Punk",      year: 2013, img: "https://picsum.photos/seed/vinyl6/400/400" },
      { id: 7,  title: "Kind of Blue",       artist: "Miles Davis",        year: 1959, img: "https://picsum.photos/seed/vinyl7/400/400" },
      { id: 8,  title: "Nevermind",          artist: "Nirvana",            year: 1991, img: "https://picsum.photos/seed/vinyl8/400/400" },
      { id: 9,  title: "Hotel California",   artist: "Eagles",             year: 1976, img: "https://picsum.photos/seed/vinyl9/400/400" },
    ];

    // ─── Render Vinyl Wall ───────────────────────────────
    const wall = document.getElementById('vinylWall');

    vinylRecords.forEach(record => {
      const item = document.createElement('div');
      item.className = 'vinyl-item';
      item.dataset.id = record.id;

      const img = document.createElement('img');
      img.className = 'vinyl-cover';
      img.src = record.img;
      img.alt = record.title;
      img.loading = 'lazy';

      const label = document.createElement('div');
      label.className = 'vinyl-label';
      label.textContent = record.title;

      item.appendChild(img);
      item.appendChild(label);

      item.addEventListener('click', () => showVinylDetail(record));
      wall.appendChild(item);
    });

    // ─── Popup Logic ─────────────────────────────────────
    const popup        = document.getElementById('vinylPopup');
    const popupImage   = document.getElementById('popupImage');
    const popupTitle   = document.getElementById('popupTitle');
    const popupArtist  = document.getElementById('popupArtist');
    const popupYear    = document.getElementById('popupYear');
    const popupClose   = document.getElementById('popupClose');

    function showVinylDetail(record) {
      popupImage.src   = record.img;
      popupImage.alt   = record.title;
      popupTitle.textContent  = record.title;
      popupArtist.textContent = record.artist;
      popupYear.textContent   = record.year;
      popup.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function hideVinylDetail() {
      popup.classList.add('hidden');
      document.body.style.overflow = '';
    }

    popupClose.addEventListener('click', hideVinylDetail);
    popup.addEventListener('click', (e) => {
      if (e.target === popup) hideVinylDetail();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') hideVinylDetail();
    });
  </script>
</body>
</html>
