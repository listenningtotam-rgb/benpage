<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — BEN 言</title>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <!-- Login View -->
  <div id="login-view" class="auth-view">
    <div class="auth-card">
      <h1 class="auth-title">Admin Login</h1>
      <form id="login-form">
        <label class="auth-label">
          Username
          <input type="text" id="login-username" autocomplete="username" required autofocus />
        </label>
        <label class="auth-label">
          Password
          <input type="password" id="login-password" autocomplete="current-password" required />
        </label>
        <p id="login-error" class="auth-error" hidden></p>
        <button type="submit" class="auth-submit">Sign In</button>
      </form>
    </div>
  </div>

  <!-- Dashboard View -->
  <div id="dash-view" class="dash" hidden>
    <header class="dash-header">
      <h1 class="dash-title">Admin Dashboard</h1>
      <div class="dash-user">
        <span id="dash-username" class="dash-username"></span>
        <a href="/" class="dash-link">← View Site</a>
        <button type="button" id="logout-btn" class="dash-logout">Logout</button>
      </div>
    </header>

    <nav class="dash-tabs">
      <button type="button" class="dash-tab active" data-tab="music">Music</button>
      <button type="button" class="dash-tab" data-tab="blog">Blog</button>
    </nav>

    <!-- Music Tab -->
    <section id="tab-music" class="dash-panel">
      <div class="panel-head">
        <h2>Music Tracks</h2>
        <button type="button" class="btn btn-primary" id="music-add-btn">+ Add Track</button>
      </div>

      <!-- Music form (hidden unless adding/editing) -->
      <div id="music-form-wrap" class="form-wrap" hidden>
        <h3 id="music-form-title">Add Track</h3>
        <form id="music-form">
          <input type="hidden" id="music-id" />
          <label class="field">Title
            <input type="text" id="music-title" required placeholder="e.g. Midnight Dreams" />
          </label>
          <label class="field">URL
            <input type="url" id="music-url" required placeholder="https://..." />
          </label>
          <label class="field">Order (lower = higher on list)
            <input type="number" id="music-sort" value="0" />
          </label>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-ghost" data-cancel="music">Cancel</button>
          </div>
        </form>
      </div>

      <div id="music-list" class="list"></div>
    </section>

    <!-- Blog Tab -->
    <section id="tab-blog" class="dash-panel" hidden>
      <div class="panel-head">
        <h2>Blog Posts</h2>
        <button type="button" class="btn btn-primary" id="blog-add-btn">+ New Post</button>
      </div>

      <!-- Blog form -->
      <div id="blog-form-wrap" class="form-wrap" hidden>
        <h3 id="blog-form-title">New Post</h3>
        <form id="blog-form">
          <input type="hidden" id="blog-id" />
          <div class="form-grid">
            <label class="field">Title
              <input type="text" id="blog-title" required placeholder="Post title" />
            </label>
            <label class="field">Tag
              <input type="text" id="blog-tag" placeholder="e.g. Story, Music, Dev, Diary" />
            </label>
            <label class="field">Date
              <input type="date" id="blog-date" />
            </label>
            <label class="field">Cover image URL
              <input type="url" id="blog-cover" placeholder="https://... (optional)" />
            </label>
          </div>

          <div class="field">
            <span class="field-label">Content blocks</span>
            <div id="blog-blocks"></div>
            <div class="block-add-row">
              <button type="button" class="btn btn-ghost btn-sm" data-add-block="text">+ Text</button>
              <button type="button" class="btn btn-ghost btn-sm" data-add-block="image">+ Image</button>
              <button type="button" class="btn btn-ghost btn-sm" data-add-block="video">+ Video</button>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Post</button>
            <button type="button" class="btn btn-ghost" data-cancel="blog">Cancel</button>
          </div>
        </form>
      </div>

      <div id="blog-list" class="list"></div>
    </section>
  </div>

  <script src="admin.js"></script>
</body>
</html>
