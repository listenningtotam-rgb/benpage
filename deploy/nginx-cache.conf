# benpage — nginx cache headers for /photo/ (optional, production)
# ------------------------------------------------------------------
# The Node app already sends correct cache headers (see the /photo/ handler in
# server.js: `Cache-Control: public, max-age=31536000, immutable` + ETag/304),
# and nginx passes those through to clients. These directives are an optional
# extra for the nginx layer itself: with `expires` set, nginx also stores the
# photo in its own cache so repeated requests (and concurrent visitors) never
# even hit the Node process.
#
# Put this inside the server{} block that proxies to the app, or in the
# matching location{} block:
#
#   location /photo/ {
#       proxy_pass http://127.0.0.1:3000;   # or whatever your upstream is
#       expires 1y;
#       add_header Cache-Control "public, max-age=31536000, immutable" always;
#   }
#
# Validate and reload:
#
#   sudo nginx -t
#   sudo systemctl reload nginx    # systemd
#   sudo service nginx reload      # sysvinit
#
# Why it's safe: uploaded photo filenames are unique per upload
# (benpage_<stamp>_<rand>.jpg) and are never overwritten, so the URL's content
# is immutable. Card-size thumbnails (…_card.jpg) follow the same rule — they
# are generated once and then served like any other photo. You only need to
# clear nginx's cache if you ever restore/rewrite files in place.
#
# Also worth noting: /photo/ has no Range/streaming requirements (those are
# only on /recordings/), so there is no proxy_buffering or range caveat here.
