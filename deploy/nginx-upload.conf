# benpage — nginx upload limit (fixes HTTP 413 on admin uploads)
# ------------------------------------------------------------------
# Symptom: posting/editing a recording (or any upload > 1 MB) in the
# admin page fails with  HTTP 413 "Request Entity Too Large".
#
# Cause: nginx's default client_max_body_size is only 1 MB, so nginx
# rejects the request BEFORE it reaches the Node app. The app's own
# limit is never consulted at that point.
#
# Fix (allow uploads up to 16 MB):
#
#   client_max_body_size 16m;
#
# Put that line inside the nginx `server { }` block that proxies to
# the Node app (usually /etc/nginx/sites-available/<site>), or inside
# a `location / { ... }` if you want to scope it to the app only.
# Then validate and reload:
#
#   sudo nginx -t
#   sudo systemctl reload nginx    # systemd
#   sudo service nginx reload      # sysvinit
#
# Notes:
#   - 16m matches the app limits (MAX_UPLOAD_BYTES / MAX_AUDIO_UPLOAD_BYTES
#     in server.js) and the client-side checks (public/admin.js). If you
#     change one, change all three. (Setting nginx HIGHER than the app, e.g.
#     100m, also works — the app then enforces the real cap with a JSON 413.)
#   - It applies to BOTH /api/upload (blog photos) and /api/music/upload
#     (recordings), since both go through the same proxy.
#   - If a file is still too big after this, the browser will now reach
#     the app and get a clear JSON error instead of nginx's 413 page.

# ⚠ Real-world gotcha that silently disabled client_max_body_size:
#   `server_name` MUST end with a semicolon. This is a real config we saw:
#
#       server {
#           listen 443 ssl;
#           server_name example.com www.example.com   ← missing ;
#           client_max_body_size 100M;
#       }
#
#   Without the ";", nginx swallows the NEXT line into the server_name
#   statement (server_name accepts a list of names), so
#   `client_max_body_size 100M;` is never parsed as a directive — nginx
#   silently keeps its default 1m limit and still returns 413 for any
#   upload > 1 MB. Fix: add the semicolon:
#
#       server_name example.com www.example.com;
#
#   Verify the effective limit (not just the file) after reloading:
#
#       sudo nginx -T 2>/dev/null | grep -n 'client_max_body_size'
#
#   and probe from outside:
#
#       head -c 2097152 /dev/urandom > /tmp/probe2m.bin
#       curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#         --data-binary @/tmp/probe2m.bin \
#         -H 'Content-Type: audio/mpeg' \
#         https://your.domain/api/music/upload
#       # 401 = body passed nginx (limit works); 413 = nginx still rejecting.

client_max_body_size 16m;
